syntax = "proto3";

package stream.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/manaraph/stream-aggregator/pkg/pb/stream/v1;streamv1";

service SensorService {
  rpc IngestSensor(stream IngestSensorRequest) returns (IngestSensorResponse);
  rpc StreamMetrics(stream StreamMetricsRequest) returns (StreamMetricsResponse);
}

message IngestSensorRequest {
  string sensor = 1;
  double value = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message IngestSensorResponse {
  bool success = 1;
  string message = 2;
}

message StreamMetricsRequest {
  uint64 processed = 1;
  uint64 dropped = 2;
  uint32 queue_used = 3;
  uint32 queue_capacity = 4;
  double queue_percent = 5;
  double rate = 6;
}

message StreamMetricsResponse {}
