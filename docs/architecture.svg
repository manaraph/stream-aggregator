<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
  <title id="title">Stream Aggregator Architecture</title>
  <desc id="description">Docker Compose runs a generator, Mosquitto, ingestion service, PostgreSQL, and gateway. Sensor events flow through MQTT to ingestion, are persisted in batches before acknowledgment and gRPC forwarding, then reach dashboard clients through WebSockets. Generator and ingestion metrics also flow to the gateway.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#15803d" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
      .boundary-label { font-size: 15px; font-weight: 700; fill: #475569; }
      .service { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; }
      .service-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .service-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 12; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-copy { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .grpc { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .persist { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .ack { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label-bg { fill: #f8fafc; opacity: .96; }
      .volume { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="40" y="38" class="title">Stream Aggregator</text>
  <rect x="25" y="58" width="1180" height="660" rx="16" class="boundary" />
  <text x="48" y="86" class="boundary-label">Docker Compose</text>

  <!-- Services -->
  <rect x="70" y="112" width="220" height="104" class="service" />
  <text x="92" y="148" class="node-title">Generator</text>
  <text x="92" y="174" class="node-copy">Creates sensor readings</text>
  <text x="92" y="197" class="node-copy">Publishes MQTT + metrics</text>

  <rect x="390" y="112" width="230" height="104" class="service" />
  <text x="415" y="148" class="node-title">Mosquitto</text>
  <text x="415" y="174" class="node-copy">MQTT broker, QoS 1</text>
  <text x="415" y="197" class="node-copy">Persistent session + broker state</text>

  <rect x="390" y="315" width="450" height="170" class="service-blue" />
  <text x="416" y="348" class="node-title">Ingestion service</text>
  <rect x="416" y="365" width="186" height="88" rx="8" fill="#ffffff" stroke="#93c5fd" />
  <text x="432" y="390" class="node-copy" font-weight="700">Bounded event queue</text>
  <text x="432" y="414" class="small">Backpressure when full</text>
  <text x="432" y="435" class="small">Batch size / interval configurable</text>
  <rect x="624" y="365" width="190" height="88" rx="8" fill="#ffffff" stroke="#93c5fd" />
  <text x="641" y="390" class="node-copy" font-weight="700">Batch writer</text>
  <text x="641" y="414" class="small">Retries failed transactions</text>
  <text x="641" y="435" class="small">Forwards after commit</text>

  <rect x="930" y="315" width="240" height="170" class="service-green" />
  <text x="955" y="349" class="node-title">PostgreSQL</text>
  <text x="955" y="375" class="node-copy">Raw sensor readings</text>
  <text x="955" y="397" class="small">Unique event_id prevents duplicates</text>
  <path d="M957 420 C957 412 1143 412 1143 420 L1143 431 C1143 439 957 439 957 431 Z" class="volume" />
  <ellipse cx="1050" cy="420" rx="93" ry="7" class="volume" />
  <text x="1050" y="458" text-anchor="middle" class="small">postgres_data volume</text>

  <rect x="390" y="550" width="280" height="120" class="service" />
  <text x="416" y="585" class="node-title">Gateway</text>
  <text x="416" y="611" class="node-copy">gRPC streaming endpoints</text>
  <text x="416" y="635" class="node-copy">WebSocket hub + runtime metrics</text>

  <rect x="1280" y="550" width="210" height="120" class="service" />
  <text x="1302" y="585" class="node-title">Dashboard clients</text>
  <text x="1302" y="611" class="node-copy">Web / mobile UI</text>
  <text x="1302" y="635" class="node-copy">Live readings and metrics</text>

  <!-- Event path -->
  <path d="M290 164 H390" class="flow" />
  <rect x="306" y="136" width="72" height="22" rx="5" class="label-bg" />
  <text x="342" y="152" text-anchor="middle" class="small">MQTT publish</text>

  <path d="M470 216 V315" class="flow" />
  <rect x="476" y="246" width="124" height="24" rx="5" class="label-bg" />
  <text x="538" y="263" text-anchor="middle" class="small">Sensor events</text>

  <!-- Broker acknowledgement after successful database commit -->
  <path d="M575 315 V216" class="ack" />
  <rect x="583" y="245" width="182" height="42" rx="5" class="label-bg" />
  <text x="591" y="261" class="small">ACK only after DB commit</text>
  <text x="591" y="278" class="small">Duplicate delivery is safe</text>

  <!-- Storage and forwarding -->
  <path d="M840 410 H930" class="persist" />
  <rect x="842" y="378" width="82" height="22" rx="5" class="label-bg" />
  <text x="883" y="394" text-anchor="middle" class="small">SQL batch</text>

  <path d="M530 485 V550" class="grpc" />
  <rect x="536" y="504" width="95" height="25" rx="5" class="label-bg" />
  <text x="583" y="521" text-anchor="middle" class="small">gRPC stream</text>

  <!-- Generator metrics stream -->
  <path d="M180 216 V610 H390" class="grpc" />
  <rect x="83" y="386" width="174" height="38" rx="5" class="label-bg" />
  <text x="170" y="402" text-anchor="middle" class="small">gRPC metrics stream</text>
  <text x="170" y="418" text-anchor="middle" class="small">from generator</text>

  <!-- Client stream -->
  <path d="M670 610 H1280" class="flow" />
  <rect x="824" y="578" width="178" height="21" rx="5" class="label-bg" />
  <text x="913" y="593" text-anchor="middle" class="small">WebSocket events + metrics</text>

  <text x="48" y="700" class="small">Time-window aggregates are queried from stored raw readings when needed.</text>
</svg>
