services:
  postgres:
    image: postgres:17-alpine
    container_name: stream-aggregator-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stream_aggregator}
      POSTGRES_USER: ${POSTGRES_USER:-stream_aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream_aggregator_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 10
      start_period: 5s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - '1883:1883'
    networks:
      - app-network
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ['CMD', 'mosquitto_sub', '-h', 'localhost', '-t', 'test', '-C', '1']
      interval: 5s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.gateway
    container_name: gateway-service
    ports:
      - '8080:8080'
      - '50051:50051'
    environment:
      - GRPC_PORT
      - HTTP_PORT
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 50051 || exit 1']
      interval: 5s
      retries: 5
      start_period: 5s

  generator:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.generator
    container_name: generator-service
    depends_on:
      - mosquitto
      - gateway
    environment:
      - MQTT_BROKER
      - GENERATOR_ID
      - PUBLISH_RATE
      - GATEWAY_ADDR
    networks:
      - app-network

  ingestion:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.ingestion
    container_name: ingestion-service
    depends_on:
      mosquitto:
        condition: service_started
      gateway:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - MQTT_BROKER
      - INGESTION_ID
      - GATEWAY_ADDR
      - INGESTION_QUEUE_SIZE
      - DB_BATCH_INTERVAL
      - DB_BATCH_SIZE
      - DATABASE_URL
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: stream-aggregator-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/monitoring/alerting:/etc/prometheus/alerting:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    depends_on:
      - gateway
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: stream-aggregator-alertmanager
    ports:
      - '9093:9093'
    environment:
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-mailpit:1025}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-stream-aggregator@localhost}
      ALERT_SMTP_TO: ${ALERT_SMTP_TO:-alerts@localhost}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-false}
    volumes:
      - ./deployments/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./deployments/monitoring/render-alertmanager-config.sh:/usr/local/bin/render-alertmanager-config:ro
    secrets:
      - smtp_password
    entrypoint: ['/bin/sh']
    command:
      - '/usr/local/bin/render-alertmanager-config'
    networks:
      - app-network
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: stream-aggregator-mailpit
    ports:
      - '8025:8025'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: stream-aggregator-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    depends_on:
      - prometheus

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

secrets:
  smtp_password:
    file: ${ALERT_SMTP_PASSWORD_FILE:-./deployments/monitoring/smtp_password.empty}
